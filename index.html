<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#101827"><title>Mi ruta GPS</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#101827;color:#f7fafc}#map{height:calc(100dvh - 175px);min-height:300px;background:#28333d}header{padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}h1{font-size:18px;margin:0;flex:1}button,.upload{border:0;border-radius:10px;background:#3478f6;color:white;padding:11px 13px;font-size:14px;font-weight:600;cursor:pointer}.upload{background:#334155}input[type=file]{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;background:#172338;text-align:center}.stats strong{display:block;font-size:17px}.stats span{font-size:11px;color:#b7c8da}.message{font-size:12px;padding:8px 14px;color:#dce7f3;min-height:34px}.me{height:16px;width:16px;border:3px solid white;border-radius:50%;background:#1b83fe;box-shadow:0 0 0 7px #2588f444}.leaflet-container{font-family:inherit}</style></head><body><header><h1>🧭 Mi ruta GPS</h1><label class="upload">📂 Cargar GPX<input id="file" type="file" accept=".gpx,.xml,application/gpx+xml,text/xml"></label><button id="gps">◎ Mi posición</button></header><div class="stats"><div><strong id="dist">—</strong><span>Longitud de ruta</span></div><div><strong id="off">—</strong><span>Distancia al trazado</span></div><div><strong id="acc">—</strong><span>Precisión GPS</span></div></div><div id="map"></div><div id="msg" class="message">Carga un GPX de Wikiloc y pulsa «Mi posición». Permite acceso a la ubicación.</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const m=L.map('map').setView([40.503,-3.530],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(m);let line=null,paths=[],marker=null,accuracy=null,watch=null,first=true;let msg=document.getElementById('msg');function rad(n){return n*Math.PI/180}function d(a,b){let x=rad(b[0]-a[0]),y=rad(b[1]-a[1]),q=Math.sin(x/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(y/2)**2;return 6371000*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}function fmt(x){return x<1000?Math.round(x)+' m':(x/1000).toFixed(2)+' km'}
document.getElementById('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let xml=new DOMParser().parseFromString(await f.text(),'application/xml');if(xml.querySelector('parsererror'))throw Error('Formato XML no válido');let segs=[...xml.getElementsByTagName('trkseg')];let groups=segs.length?segs.map(s=>[...s.getElementsByTagName('trkpt')]):[[...xml.getElementsByTagName('rtept')]];let p=groups.map(g=>g.map(z=>[Number(z.getAttribute('lat')),Number(z.getAttribute('lon'))]).filter(z=>z.every(Number.isFinite))).filter(z=>z.length>1);if(!p.length)throw Error('No hay puntos de ruta en ese GPX');if(line)m.removeLayer(line);line=L.polyline(p,{color:'#f43f5e',weight:6,opacity:.95}).addTo(m);paths=p;m.fitBounds(line.getBounds(),{padding:[24,24]});let sum=p.reduce((s,g)=>s+g.slice(1).reduce((v,x,i)=>v+d(g[i],x),0),0);document.getElementById('dist').textContent=fmt(sum);msg.textContent='Ruta cargada: '+f.name+'. Activa el GPS.'}catch(err){msg.textContent='Error: '+err.message}}
function nearest(p){let best=Infinity;for(const path of paths){for(let i=1;i<path.length;i++){let a=path[i-1],b=path[i];let lat=rad(p[0]),scaleX=111320*Math.cos(lat),scaleY=111320;let vx=(b[1]-a[1])*scaleX,vy=(b[0]-a[0])*scaleY,wx=(p[1]-a[1])*scaleX,wy=(p[0]-a[0])*scaleY;let t=Math.max(0,Math.min(1,(wx*vx+wy*vy)/(vx*vx+vy*vy||1)));best=Math.min(best,Math.hypot(wx-t*vx,wy-t*vy))}}return best}
document.getElementById('gps').onclick=()=>{if(!navigator.geolocation){msg.textContent='El navegador no admite geolocalización';return}if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null;document.getElementById('gps').textContent='◎ Mi posición';msg.textContent='GPS detenido';return}first=true;watch=navigator.geolocation.watchPosition(pos=>{let p=[pos.coords.latitude,pos.coords.longitude],a=pos.coords.accuracy;if(!marker){marker=L.marker(p,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(m)}else marker.setLatLng(p);if(accuracy)m.removeLayer(accuracy);accuracy=L.circle(p,{radius:a,color:'#2488f4',weight:1,fillOpacity:.08}).addTo(m);document.getElementById('acc').textContent='±'+Math.round(a)+' m';if(paths.length){let n=nearest(p);document.getElementById('off').textContent=fmt(n);msg.textContent=n>Math.max(40,a*1.5)?'⚠️ Pareces estar fuera de la ruta. Comprueba el camino.':'✓ GPS actualizado'}else msg.textContent='GPS activo. Carga un GPX para ver la ruta.';if(first){m.setView(p,16);first=false}},err=>{msg.textContent='Error de ubicación: '+err.message+' (revisa permisos y HTTPS).';document.getElementById('gps').textContent='◎ Mi posición';if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null},{enableHighAccuracy:true,maximumAge:1000,timeout:20000});document.getElementById('gps').textContent='■ Detener GPS'};
</script></body></html>
